name: Container Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/container-scan.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
      id-token: write # uv-nora: OIDC token for packages.maestra.io
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # BuildKit pulls the base images through nora (packages.maestra.io, issues-maestra#1649)
      # with ~/.docker/config.json. nora takes the GitHub OIDC token, which lives minutes: a
      # credential helper mints a fresh one per pull. Same step as dotnet-service-build.yml in
      # maestra-io/github-actions.
      - name: nora docker credentials
        env:
          AUDIENCE: packages.maestra.io
          PACKAGES_URL: https://packages.maestra.io
        run: |
          # >>> nora-cred-helper (copy of maestra-io/github-actions dotnet-service-build.yml)
          bin="$RUNNER_TEMP/nora-bin"; mkdir -p "$bin"
          # The helper runs in the caller's environment, which tox and other test runners
          # scrub: the job's OIDC request URL and token go to a 0600 file next to it.
          ( umask 077; printf 'url=%q\ntoken=%q\naud=%q\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$AUDIENCE" > "$bin/oidc.env" )
          cat > "$bin/docker-credential-nora" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = get ] || exit 0
          server=$(cat) # docker sends it without a newline
          . "${BASH_SOURCE[0]%/*}/oidc.env"
          t=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 -H "Authorization: bearer $token" \
            "$url&audience=$aud" | jq -r '.value // empty')
          [ -n "$t" ]
          jq -cn --arg s "$server" --arg t "$t" '{ServerURL: $s, Username: "token", Secret: $t}'
          EOF
          chmod 755 "$bin/docker-credential-nora"
          echo "$bin" >> "$GITHUB_PATH"
          host="${PACKAGES_URL#*://}"; host="${host%%/*}"
          cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"; mkdir -p "$(dirname "$cfg")"
          [ -s "$cfg" ] || echo '{}' > "$cfg"
          jq --arg h "$host" '.credHelpers[$h] = "nora"' "$cfg" > "$cfg.t" && mv "$cfg.t" "$cfg"
          # <<< nora-cred-helper

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # maestra: the Dockerfile installs from nora with this token (BuildKit
      # secret); it lives 360 s, so it is minted right before the build.
      - name: Token for nora
        id: nora
        uses: maestra-io/github-actions/uv-nora@22ccbf9ff3d76fe13025cbc009d395024f025198 # v1.67.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          secrets: |
            PRIVATE_PACKAGES_TOKEN=${{ steps.nora.outputs.token }}
          load: true
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: netbox-mcp-server:scan

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: netbox-mcp-server:scan
          format: json
          output: trivy-output.json
          vuln-type: os,library
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: "0"
          list-all-pkgs: "true"

      - name: Build scan summary
        id: scan-summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('trivy-output.json', 'utf8'));
            const vulns = (data.Results || []).flatMap(r =>
              (r.Vulnerabilities || []).map(v => ({ ...v, target: r.Target }))
            );
            const blockingSeverities = new Set(['CRITICAL', 'HIGH']);
            const SEVERITY_LABEL = { CRITICAL: '🔴 **CRITICAL**', HIGH: '🟠 **HIGH**', MEDIUM: '🟡 MEDIUM', LOW: '⚪ LOW' };
            const hasBlocking = vulns.some(v => blockingSeverities.has(v.Severity));
            core.setOutput('has_blocking', hasBlocking.toString());
            const buildTable = (vulns) => {
              if (vulns.length === 0) return '_No vulnerabilities found._\n';
              let t = '| Source | Library | CVE | Severity | Installed | Fixed | Title |\n|---|---|---|---|---|---|---|\n';
              for (const v of vulns) {
                const title = (v.Title || '').replace(/\|/g, '\\|').substring(0, 80);
                const cve = v.PrimaryURL ? `[${v.VulnerabilityID}](${v.PrimaryURL})` : v.VulnerabilityID;
                const source = (v.target || '').replace(/\|/g, '\|');
                t += `| ${source} | ${v.PkgName} | ${cve} | ${SEVERITY_LABEL[v.Severity] || v.Severity} | ${v.InstalledVersion} | ${v.FixedVersion || 'N/A'} | ${title} |\n`;
              }
              return t;
            };
            const table = buildTable(vulns);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Vulnerability Scan Results\n\n' + table);
            fs.writeFileSync('scan-result.json', JSON.stringify({ table, hasBlocking }));

      - name: Post scan results as PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true  # Fork PRs have read-only tokens and can't post comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const { table, hasBlocking } = JSON.parse(fs.readFileSync('scan-result.json', 'utf8'));
            const heading = hasBlocking
              ? '## Vulnerability Scan: Failed — blocking vulnerabilities detected'
              : '## Vulnerability Scan: Passed';
            const commitSha = process.env.COMMIT_SHA;
            const marker = '<!-- trivy-scan-results -->';
            const body = `${marker}\n${heading}\n\n**Image:** \`netbox-mcp-server:scan\`\n\n${table}\n*Commit: ${commitSha}*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Fail on blocking vulnerabilities
        if: steps.scan-summary.outputs.has_blocking == 'true'
        run: |
          echo "Blocking vulnerabilities found (CRITICAL or HIGH). Failing build."
          exit 1

      - name: Convert scan results to SBOM
        if: "!cancelled()"
        run: trivy convert --format cyclonedx --output sbom.cdx.json trivy-output.json

      - name: Upload SBOM artifact
        if: "!cancelled()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Convert scan results to SARIF
        if: "!cancelled()"
        run: trivy convert --format sarif --output trivy-results.sarif trivy-output.json

      - name: Upload SARIF to GitHub Code Scanning
        if: "!cancelled()"
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
